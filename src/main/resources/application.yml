# Auditoría: Configuración principal de la aplicación Spring Boot, OpenAPI, servidor y perfiles.

server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: label-viewer
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Configuración de OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Configuración personalizada de Label Viewer
labelviewer:
  render:
    default-dpi: 203
    default-width-mm: 100
    default-height-mm: 150
    default-format: PNG
